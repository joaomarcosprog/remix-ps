<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>P.S Treinamentos | Resgate e Resposta Rápida</title>
    <meta name="title" content="P.S Treinamentos | Resgate e Resposta Rápida">
    <meta name="description" content="Terceirização de Bombeiros Civis, Guarda-Vidas e Cursos de Formação Profissional em Santa Cruz Cabrália e Região. Compromisso com a vida e resposta rápida.">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ps-treinamentos.vercel.app/">
    <meta property="og:title" content="P.S Treinamentos | Resgate e Resposta Rápida">
    <meta property="og:description" content="Especialistas em salvamento aquático, combate a incêndio e primeiros socorros. Formação de elite e serviços de staff para eventos e empresas.">
    <meta property="og:image" content="https://i.ibb.co/Swy0Dcys/Snap-Insta-to-488600621-1777644026427240-6858777735056928768-n.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Favicon Otimizado (PNG Transparente fornecido pelo usuário) -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/gZJ0TZFd/Adobe-Express-file.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Oswald', 'sans-serif'],
            },
            colors: {
              emergency: {
                red: '#DC2626',
                dark: '#991B1B',
                black: '#111111',
                gray: '#F3F4F6'
              }
            },
            backgroundImage: {
              'hazard-pattern': "repeating-linear-gradient(45deg, #DC2626, #DC2626 10px, #B91C1C 10px, #B91C1C 20px)",
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      body {
        background-color: #111;
        color: white;
      }
      .clip-diagonal {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
      }
      .clip-chevron {
        clip-path: polygon(0% 0%, 75% 0%, 100% 50%, 75% 100%, 0% 100%);
      }
      
      /* Emergency Flash Animation */
      @keyframes emergency-flash {
        0%, 100% { box-shadow: 0 0 0 rgba(220, 38, 38, 0); }
        50% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.6); }
      }
      .btn-emergency-pulse {
        animation: emergency-flash 2s infinite;
      }

      /* Image skeleton loading animation */
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .img-skeleton {
        background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
        background-size: 1000px 100%;
        animation: shimmer 2s infinite linear;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Título Dinâmico para Reengajamento -->
    <script>
      let originalTitle = document.title;
      window.addEventListener("blur", () => {
        document.title = "⚠️ Aguardando Resgate...";
      });
      window.addEventListener("focus", () => {
        document.title = originalTitle;
      });
    </script>
  </body>
</html>
